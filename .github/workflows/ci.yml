name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    env:
      AIRFLOW_VERSION: "3.1.3"
      PYTHON_VERSION: "3.12"
      CONSTRAINT_URL: https://raw.githubusercontent.com/apache/airflow/constraints-3.1.3/constraints-3.12.txt
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --constraint "${CONSTRAINT_URL}"
          pip install ruff==0.14.4 pytest==8.4.2 pytest-mock==3.15.1

      - name: Ruff AIR3 on migrated code
        run: ruff check after spark/after src/br_market --select AIR301,AIR302,AIR311,AIR312

      - name: Tests
        run: pytest -q
